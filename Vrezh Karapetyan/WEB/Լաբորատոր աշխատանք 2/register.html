<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Երաժշտական դպրոց — Գրանցում</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1> Երաժշտական դպրոց</h1>
    <nav aria-label="Հիմնական մենյու">
      <ul class="nav-list">
        <li><a href="index.html">Գլխավոր</a></li>
        <li><a href="school.html">Դպրոցի մասին</a></li>
        <li><a href="register.html">Գրանցում</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="register">
      <h2>Գրանցում երաժշտական դասի</h2>
      <form class="reg-form" action="#" method="post">
        <fieldset>
          <legend>Անձնական տվյալներ</legend>

          <label for="fullname">Անուն, ազգանուն</label>
          <input type="text" id="fullname" name="fullname" required minlength="3" maxlength="60"
                 pattern="[A-Za-zԱ-Ֆա-և\s\-]{3,60}" placeholder="Օր.՝ Վրեժ Կարապետյան"
                 title="Միայն տառեր, 3–60 նիշ">

          <label for="email">Էլ. փոստ</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">

          <label for="phone">Հեռախոս</label>
          <input type="tel" id="phone" name="phone" required pattern="\+?[0-9\s\-]{8,15}"
                 placeholder="+374 xx xxx xxx" title="8–15 թվանշան">

          <label for="age">Տարիք</label>
          <input type="number" id="age" name="age" min="5" max="80" required>
        </fieldset>

        <fieldset>
          <legend>Երաժշտական դասի գրանցման ձև</legend>

          <label for="instrument">Գործիք կամ ուղղություն</label>
          <select id="instrument" name="instrument" required>
            <option value="">— Ընտրել —</option>
            <option value="piano">Դաշնամուր</option>
            <option value="violin">Ջութակ</option>
            <option value="guitar">Կիթառ</option>
            <option value="vocal">Վոկալ</option>
          </select>

          <p id="level-label">Փորձի մակարդակ</p>
          <div role="radiogroup" aria-labelledby="level-label" class="radio-row">
            <label><input type="radio" name="level" value="beginner" required> Սկսնակ</label>
            <label><input type="radio" name="level" value="middle"> Միջին</label>
            <label><input type="radio" name="level" value="advanced"> Առաջադեմ</label>
          </div>

          <label for="lesson-time">Նախընտրելի դասաժամ</label>
          <input type="time" id="lesson-time" name="lesson_time" min="09:00" max="20:00" required>

          <label for="date">Սկսելու ամսաթիվ</label>
          <input type="date" id="date" name="start_date">

          <label for="comment">Լրացուցիչ մեկնաբանություն</label>
          <textarea id="comment" name="comment" rows="4" maxlength="300"></textarea>

          <label class="check"><input type="checkbox" name="agree" required> Համաձայն եմ դպրոցի կանոններին</label>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn">Գրանցվել</button>
          <button type="reset" class="btn btn-secondary">Մաքրել</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 N 9 Երաժշտական դպրոց</p>
  </footer>
</body>
</html>
