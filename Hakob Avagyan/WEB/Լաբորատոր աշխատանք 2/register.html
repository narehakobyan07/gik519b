<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Գրանցում — Կամավորական կենտրոն «ԱԿՏ»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo-area">
            <h1>Կամավորական կենտրոն «ԱԿՏ»</h1>
            <p>Ակտիվ Կամավոր Տիրույթ · Հայաստան · 2015-ից</p>
        </div>
        <nav aria-label="Գլխավոր նավիգացիա">
            <ul>
                <li><a href="index.html">Գլխավոր</a></li>
                <li><a href="programs.html">Ծրագրեր</a></li>
                <li><a href="register.html" aria-current="page">Միանալ</a></li>
                <li><a href="index.html#contact">Կապ</a></li>
            </ul>
        </nav>
    </div>
</header>

<div class="page-hero">
    <h2>Դարձի՛ր կամավոր</h2>
    <p>Լրացրու ձևն ու միացի՛ր մեզ</p>
</div>

<main>
    <form class="reg-form" id="reg-form" method="post" action="#" novalidate>
        <fieldset>
            <legend>👤 Անձնական տվյալներ</legend>
            <div class="field-row">
                <div class="field">
                    <label for="first-name">Անուն *</label>
                    <input type="text" id="first-name" name="first_name" required minlength="2">
                </div>
                <div class="field">
                    <label for="email">Էլ. փոստ *</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
        </fieldset>
        <div class="form-actions">
            <button type="submit" class="btn-submit">✅ Ուղարկել դիմումը</button>
            <button type="reset" class="btn-reset">↺ Մաքրել</button>
        </div>
    </form>
    <div id="success-banner" style="display:none; background: #27ae60; color: #fff; padding: 20px; border-radius: 8px; text-align: center;">
        🎉 Ձեր դիմումը հաջողությամբ ուղարկվեց։ Շնորհակալ ենք!
    </div>
</main>

<footer>
    <div class="footer-bottom">
        <small>© 2025 Կամավորական կենտրոն «ԱԿՏ»</small>
    </div>
</footer>

<script>
    document.getElementById("reg-form").addEventListener("submit", function(e) {
        e.preventDefault();
        if (this.checkValidity()) {
            this.style.display = "none";
            document.getElementById("success-banner").style.display = "block";
        } else {
            this.reportValidity();
        }
    });
</script>

</body>
</html>
