<!DOCTYPE html>
<html lang="hy">

<head>
  <!-- Nshum enq ej-i lezun, kodavorumy ev ekranayin chapsery -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Արդի Գրադարան | Մուտք</title>

  <!-- HTML ejy kapum enq arandzin CSS fayli het -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Stexcum enq navigaciayi panel, vori mijocov ogtaticy karox e ancnel kayqi ayl ejery -->
  <nav class="navbar">
    <a href="index.html" class="logo"> 📖 VELL<span>.LIB</span></a>

    <!-- Kayqi ejery kapox navigaciayi hghumner -->
    <ul class="nav-links">
      <li><a href="index.html">Գլխավոր</a></li>
      <li><a href="catalog.html">Կատալոգ</a></li>
      <li><a href="resources.html">Թվային Ռեսուրսներ</a></li>
      <li><a href="about.html">Մեր մասին</a></li>
      <li><a href="contact.html">Կապ</a></li>
    </ul>

    <!-- Mutqi ej ancnelu hamar arandzin blok -->
    <div class="nav-actions">
      <a href="login.html" class="btn-outline">Մուտք</a>
    </div>
  </nav>

  <!-- Ej-i himnakan masy, vori mej texadրված e mutqi forma -->
  <main class="container">

    <!-- Auth-container-y patasxanatu e mutqi bloky ejum kentronacnelu hamar -->
    <div class="auth-container">

      <!-- Glass-card-y ogtagorcum enq formai hamar arandzin dizaynayin konteyner -->
      <div class="glass-card">
        <h2 style="text-align: center; margin-bottom: 20px;">Մուտք Համակարգ</h2>

        <!-- Forma, vori mijocov ogtaticy mutqagrum e hashvi tvyalnery -->
        <form>

          <!-- Email hascei mutqagrman hamar sahmanvac dasht -->
          <div class="form-group">
            <label>Էլ․ փոստ</label>
            <input type="email" placeholder="Էլ․ փոստի հասցեն" required>
          </div>

          <!-- Gaghtnabar-i mutqagrman dasht, vori tvyalnery cuyc chen trvum sovorakan text-i tesqov -->
          <div class="form-group">
            <label>Գաղտնաբառ</label>
            <input type="password" placeholder="••••••••" required>
          </div>

          <!-- Submit knopkan naxatesvac e mutqi form-y uxarkelu hamar -->
          <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Մուտք Գործել</button>
        </form>

        <!-- Grancman ej ancnelu hghumy texadրված e mutqi formic nerqev -->
        <p style="text-align: center; margin-top: 15px; color: var(--text-muted); font-size: 0.85rem;">
          Չունե՞ք հաշիվ: <a href="#" style="color: var(--primary-accent);">Գրանցվել</a>
        </p>
      </div>
    </div>
  </main>

  <!-- Footer-y kayqi nerqevum gtnvox hakirjayin masn e -->
  <footer>
    <p>&copy; 2026 Արդի Գրադարան. Բոլոր իրավունքները պաշտպանված են:</p>
  </footer>

</body>

</html>
