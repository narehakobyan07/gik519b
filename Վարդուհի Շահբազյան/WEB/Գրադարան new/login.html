<!DOCTYPE html>
<html lang="hy">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Արդի Գրադարան | Մուտք</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html" class="logo">📖 VELL<span>.LIB</span></a>

    <ul class="nav-links">
      <li><a href="index.html">Գլխավոր</a></li>
      <li><a href="catalog.html">Կատալոգ</a></li>
      <li><a href="resources.html">Թվային Ռեսուրսներ</a></li>
      <li><a href="about.html">Մեր մասին</a></li>
      <li><a href="contact.html">Կապ</a></li>
    </ul>

    <div class="nav-actions">
      <a href="login.html" class="btn-outline">Մուտք</a>
    </div>
  </nav>

  <main class="container login-page">

    <div class="auth-container">
      <div class="glass-card login-card">

        <h2 class="login-title">Մուտք Համակարգ</h2>

        <form class="login-form">

          <div class="form-group">
            <label for="login-email">Էլ․ փոստ</label>
            <input type="email" id="login-email" name="email" placeholder="Էլ․ փոստի հասցեն" autocomplete="email"
              required>
          </div>

          <div class="form-group">
            <label for="login-password">Գաղտնաբառ</label>
            <input type="password" id="login-password" name="password" placeholder="••••••••"
              autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn-primary login-button">
            Մուտք Գործել
          </button>

        </form>

        <p class="register-text">
          Չունե՞ք հաշիվ:
          <a href="#" class="register-link">Գրանցվել</a>
        </p>

      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 Արդի Գրադարան. Բոլոր իրավունքները պաշտպանված են:</p>
  </footer>

</body>

</html>
