<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <!-- Գրադիենտ լոգոյի նշանի համար -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Գրադիենտ տեքստի ընդգծման համար -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Իկոն (Գիրք + Ավարտական Գլխարկ / Վերասլաց Սլաք) -->
  <g transform="translate(10, 10)">
    <!-- Գրքի հիմք/էջեր -->
    <path d="M 20,65 C 35,55 50,65 60,70 C 70,65 85,55 100,65 L 100,35 C 85,25 70,35 60,40 C 50,35 35,25 20,35 Z" 
          fill="none" 
          stroke="url(#logoGradient)" 
          stroke-width="5" 
          stroke-linejoin="round"/>
    
    <!-- Ավարտական գլխարկ (Graduation Cap) -->
    <polygon points="60,10 95,25 60,40 25,25" fill="url(#logoGradient)" />
    <path d="M 38,32 L 38,50 C 38,58 82,58 82,50 L 82,32" 
          fill="none" 
          stroke="#1e293b" 
          stroke-width="4" 
          stroke-linecap="round"/>
    <path d="M 88,28 L 88,48" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="88" cy="50" r="3" fill="#3b82f6"/>
  </g>

  <!-- Տեքստային մաս (EduCenter) -->
  <text x="125" y="58" 
        font-family="'Noto Sans Armenian', 'Segoe UI', sans-serif" 
        font-size="36" 
        font-weight="700" 
        fill="#0f172a">
    Edu<tspan fill="url(#logoGradient)">Center</tspan>
  </text>
  
  <!-- Ենթավերնագիր (Educational Center) -->
  <text x="127" y="78" 
        font-family="'Noto Sans Armenian', 'Segoe UI', sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#64748b">
    EDUCATIONAL CENTER
  </text>
</svg>
