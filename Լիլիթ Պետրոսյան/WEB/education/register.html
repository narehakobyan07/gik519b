<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Օնլայն Հայտադիմում - EduCenter</title>
    <link rel="stylesheet" href="register.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <div class="logo"><a href="index.html">
                <img src="images/logo.svg" alt="EduCenter Logo" style="height: 60px;"></a></div>
        <nav>
            <ul>
                <li><a href="index.html">Գլխավոր</a></li>
                <li><a href="index.html#courses">Դասընթացներ</a></li>
                <li><a href="about.html">Մեր մասին</a></li>
                <li><a href="contacts.html">Կապ</a></li>
            </ul>
        </nav>
        <a href="register.html" class="btn btn-secondary active-btn">Գրանցում</a>
    </header>

    <section class="registration-section">
        <div class="container">
            <div class="form-card">

                <div class="form-header">
                    <h2>Օնլայն հայտադիմում</h2>
                    <p>Լրացրեք ձևաթուղթը, և մեր մասնագետը կկապնվի ձեզ հետ 15 րոպեի ընթացքում:</p>
                </div>

                <form action="#" method="POST" class="registration-form">

                    <div class="form-group">
                        <label for="fullname">Անուն Ազգանուն *</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Օրինակ՝ Արմեն Գրիգորյան" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Հեռախոսահամար *</label>
                        <input type="tel" id="phone" name="phone" placeholder="+374 99 123456" required>
                    </div>

                    <div class="form-group">
                        <label for="course">Ընտրեք դասընթացը *</label>
                        <select id="course" name="course" required>
                            <option value="" disabled selected>-- Ընտրեք դասընթացը --</option>
                            <option value="web">Web Ծրագրավորում (HTML/CSS)</option>
                            <option value="js">JavaScript & React</option>
                            <option value="python">Python & AI Base</option>
                            <option value="design">Graphic Design (Photoshop, Illustrator, Canva)</option>
                            <option value="uiux">UI/UX Design (Figma)</option>
                            <option value="smm">SMM & Content Creation</option>
                            <option value="marketing">Digital Marketing (SEO/PPC/SMM)</option>
                            <option value="english">General English (Անգլերեն)</option>
                            <option value="it-english">IT English (Մասնագիտական)</option>
                            <option value="german">Գերմաներեն (A1-B2)</option>
                            <option value="accounting">Ժամանակակից Հաշվապահություն + 1C</option>
                            <option value="pedagogy">Նախադպրոցական Մանկավարժություն</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ուսուցման ձևաչափը</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="format" value="presential" checked> Առկա (Լսարանային)
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="format" value="online"> Օնլայն
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Լրացուցիչ հարցեր կամ նշումներ</label>
                        <textarea id="message" name="message" rows="3"
                            placeholder="Գրեք ձեր հարցը այստեղ..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-submit">Ուղարկել Հայտը</button>

                </form>

            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 EduCenter. Բոլոր իրավունքները պաշտպանված են:</p>
    </footer>

</body>

</html>
